<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="52%" stop-color="#0B1B22"/>
      <stop offset="100%" stop-color="#102A2B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4DE1C1"/>
      <stop offset="100%" stop-color="#65B7FF"/>
    </linearGradient>
    <radialGradient id="glow1"><stop offset="0%" stop-color="#3BE0BB" stop-opacity=".24"/><stop offset="100%" stop-color="#3BE0BB" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2"><stop offset="0%" stop-color="#5DB7FF" stop-opacity=".18"/><stop offset="100%" stop-color="#5DB7FF" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity=".42"/></filter>
    <style>
      .micro{font:700 13px "Plus Jakarta Sans",Arial,sans-serif;letter-spacing:3px;fill:#61E4C8}
      .title{font:700 66px "Plus Jakarta Sans",Arial,sans-serif;fill:#F4FBFA}
      .sub{font:500 23px "Plus Jakarta Sans",Arial,sans-serif;fill:#A9C1C3}
      .pill{font:700 12px "Plus Jakarta Sans",Arial,sans-serif;letter-spacing:1px;fill:#C4D6D7}
      .ui{font:600 11px "JetBrains Mono",Consolas,monospace;fill:#BBD0D1}
    </style>
  </defs>
  <rect width="1600" height="500" rx="28" fill="url(#bg)"/>
  <circle cx="1330" cy="80" r="360" fill="url(#glow1)"/>
  <circle cx="1510" cy="420" r="300" fill="url(#glow2)"/>
  <g opacity=".08" stroke="#A9D2D0" stroke-width="1">
    <path d="M0 100H1600M0 200H1600M0 300H1600M0 400H1600"/>
    <path d="M120 0V500M240 0V500M360 0V500M480 0V500M600 0V500M720 0V500M840 0V500M960 0V500M1080 0V500M1200 0V500M1320 0V500M1440 0V500"/>
  </g>
  <g transform="translate(92,80)">
    <text x="0" y="0" class="micro">EXECUTION-GROUNDED DATA INTELLIGENCE</text>
    <text x="0" y="88" class="title">AI Data Analyst</text>
    <text x="0" y="128" class="sub">Ask questions in plain English. Execute real SQL or Python.</text>
    <text x="0" y="162" class="sub">Return verified answers, not plausible guesses.</text>
    <g transform="translate(0,205)">
      <rect x="0" y="0" width="118" height="34" rx="17" fill="#102226" stroke="#294245"/>
      <text x="59" y="22" text-anchor="middle" class="pill">DUCKDB-WASM</text>
      <rect x="130" y="0" width="112" height="34" rx="17" fill="#102226" stroke="#294245"/>
      <text x="186" y="22" text-anchor="middle" class="pill">PYODIDE</text>
      <rect x="254" y="0" width="93" height="34" rx="17" fill="#102226" stroke="#294245"/>
      <text x="300" y="22" text-anchor="middle" class="pill">GROQ</text>
      <rect x="359" y="0" width="106" height="34" rx="17" fill="#102226" stroke="#294245"/>
      <text x="412" y="22" text-anchor="middle" class="pill">VERCEL</text>
    </g>
  </g>
  <g transform="translate(950,63)" filter="url(#shadow)">
    <rect x="0" y="0" width="540" height="366" rx="30" fill="#091318" stroke="#254045" stroke-width="2"/>
    <rect x="22" y="22" width="496" height="322" rx="22" fill="#071014" stroke="#192F33"/>
    <text x="48" y="57" class="ui">QUERY EXECUTION</text>
    <circle cx="476" cy="52" r="6" fill="#4DE1C1"/>
    <rect x="48" y="82" width="444" height="70" rx="16" fill="#0D2022" stroke="#204244"/>
    <text x="67" y="108" class="ui">QUESTION</text>
    <text x="67" y="131" class="ui">"Which region has the highest revenue?"</text>
    <path d="M270 163v34" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="270" cy="198" r="7" fill="#4DE1C1"/>
    <rect x="48" y="214" width="444" height="58" rx="15" fill="#0C181D" stroke="#234044"/>
    <text x="68" y="238" class="ui">GENERATED</text>
    <text x="68" y="258" class="ui">SELECT region, SUM(revenue) ...</text>
    <path d="M270 281v26" stroke="url(#accent)" stroke-width="3"/>
    <rect x="48" y="314" width="444" height="20" rx="10" fill="#12372F"/>
    <rect x="48" y="314" width="318" height="20" rx="10" fill="url(#accent)" opacity=".7"/>
    <text x="270" y="329" text-anchor="middle" class="ui" fill="#EAF8F5">VERIFIED RESULT</text>
  </g>
  <text x="92" y="442" class="micro" opacity=".72">CSV • SQL • PYTHON • INSIGHTS • VALIDATION • RETRIES</text>
  <text x="1508" y="442" text-anchor="end" class="ui" opacity=".52">AI DATA ANALYST AGENT</text>
</svg>